# .github/workflows/smoke-test.yml
# Manuaalisesti käynnistettävä live-smoke-test WIF-autentikaatiolla.
# Vaatii GitHub Secrets: WIF_PROVIDER, WIF_SERVICE_ACCOUNT
# Issue: #21
#
# Turvallisuushuomio:
#   - if: github.ref == 'refs/heads/main' estää workflown käynnistämisen
#     muista haaroista runtime-tasolla.
#   - WIF attribute_condition (terraform/wif.tf) sallii tämän workflown
#     vain main-haarasta myös GCP-tasolla.
#   - concurrency-ryhmä estää rinnakkaiset ajot (ei vaaraa mutta siisti).
#
# Huom: workflow_dispatch ei tue branches-filttteriä (GitHub-rajoite) —
# kenttä ohitetaan hiljaa eikä estä käynnistystä muista haaroista.
# Suoja on toteutettu if:-ehdolla ja WIF attribute_condition:lla.

name: Live smoke test

on:
  workflow_dispatch:

concurrency:
  group: smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@817b83d791af8a1f089ef2143eb5d630d403aa0d # v2.1.4
      - run: bash live-smoke-test.sh
