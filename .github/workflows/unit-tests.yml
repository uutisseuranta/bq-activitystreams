name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install defusedxml -r requirements.txt -r requirements-dev.txt
      - name: Run Ruff style and security checks
        run: ruff check . --output-format=github
      - run: bash unit-test.sh
      - name: Verify STANDARDS.md is in sync with schemas
        run: |
          chmod +x generate-standards.sh
          ./generate-standards.sh
          git diff --exit-code STANDARDS.md

  terraform-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install checkov
        run: pip install checkov==3.2.348
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: "v0.55.0"
      - name: tflint init (google plugin)
        run: tflint --init
        working-directory: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint – Terraform lint
        run: tflint --format compact --no-color
        working-directory: ./
      - name: Checkov – Terraform staattinen analyysi
        run: |
          checkov -d ./ \
            --framework terraform \
            --output github_failed_only \
            --hard-fail-on HIGH \
            --skip-check CKV_GCP_82,CKV_GCP_34

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform plan
        run: |
          terraform plan -no-color 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        env:
          TF_VAR_gcp_project: uutisseuranta-activitystreams
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: [unit-test, terraform-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: Rakenna ja julkaise kontti-imaget
        run: |
          gcloud builds submit --tag europe-north1-docker.pkg.dev/uutisseuranta-activitystreams/jobs/query-api:${{ github.sha }} \
            --project uutisseuranta-activitystreams
          gcloud builds submit --tag europe-north1-docker.pkg.dev/uutisseuranta-activitystreams/jobs/write-api:${{ github.sha }} \
            --project uutisseuranta-activitystreams
          gcloud builds submit --tag europe-north1-docker.pkg.dev/uutisseuranta-activitystreams/jobs/og-scraper:${{ github.sha }} \
            --project uutisseuranta-activitystreams

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: |
          terraform apply -auto-approve \
            -var="query_api_image_tag=${{ github.sha }}" \
            -var="write_api_image_tag=${{ github.sha }}" \
            -var="og_scraper_image_tag=${{ github.sha }}" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}" \
            -var="google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}"
        env:
          TF_VAR_gcp_project: uutisseuranta-activitystreams

  notify-ops:
    needs: [unit-test, terraform-lint, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.unit-test.result }}" = "failure" ] || \
             [ "${{ needs.terraform-lint.result }}" = "failure" ] || \
             [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
      - name: Send Status to Centralized CI Monitor (ops repo)
        env:
          OPS_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$OPS_TOKEN" ]; then
            echo "::warning::OPS_DISPATCH_TOKEN secret is missing! Skipping notification."
            exit 0
          fi
          curl -s -X POST \
            -H "Authorization: token $OPS_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/uutisseuranta/ops/dispatches \
            -d '{
              "event_type": "workflow-notification",
              "client_payload": {
                "repo": "${{ github.repository }}",
                "workflow": "${{ github.workflow }}",
                "status": "${{ steps.status.outputs.status }}",
                "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'

