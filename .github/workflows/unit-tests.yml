name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install defusedxml -r requirements.txt -r requirements-dev.txt
      - name: Run Ruff style and security checks
        run: ruff check . --output-format=github
      - run: bash unit-test.sh
      - name: Verify STANDARDS.md is in sync with schemas
        run: |
          chmod +x generate-standards.sh
          ./generate-standards.sh
          git diff --exit-code STANDARDS.md

  terraform-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install checkov
        run: pip install checkov==3.2.348
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: "v0.55.0"
      - name: tflint init (google plugin)
        run: tflint --init
        working-directory: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint – Terraform lint
        run: tflint --format compact --no-color
        working-directory: ./
      - name: Checkov – Terraform staattinen analyysi
        run: |
          checkov -d ./ \
            --framework terraform \
            --output github_failed_only \
            --hard-fail-on HIGH \
            --skip-check CKV_GCP_82,CKV_GCP_34

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
      - name: terraform init (no backend)
        run: terraform init -backend=false
      - name: terraform plan
        run: |
          terraform plan -no-color 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        env:
          TF_VAR_gcp_project: uutisseuranta-activitystreams
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}

