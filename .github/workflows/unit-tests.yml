name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524a0c28ba1334f08a6d527f5bc7cc60444 # v5.1.1
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install defusedxml -r requirements-dev.txt
          find src -name "requirements.txt" -exec pip install -r {} \;
      - name: Run Ruff style and security checks
        run: ruff check . --output-format=github
      - run: bash unit-test.sh
      - name: Verify STANDARDS.md is in sync with schemas
        run: |
          chmod +x generate-standards.sh
          ./generate-standards.sh
          git diff --exit-code STANDARDS.md

  terraform-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524a0c28ba1334f08a6d527f5bc7cc60444 # v5.1.1
        with:
          python-version: "3.11"
      - name: Install checkov
        run: pip install checkov==3.2.348
      - uses: actions/setup-go@d60b41a563a30eb0a0f8c768e0d4c1fbc3b56b56 # v5.5.0
        with:
          go-version: "1.22"
      - uses: terraform-linters/setup-tflint@90f302a83f2b5ef4b8e51f50a5db5ec6e1f11827 # v4.1.1
        with:
          tflint_version: "v0.55.0"
      - name: tflint init (google plugin)
        run: tflint --init
        working-directory: terraform/
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint – Terraform lint
        run: tflint --format compact --no-color
        working-directory: terraform/
      - name: Checkov – Terraform staattinen analyysi
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --output github_failed_only \
            --check-level HIGH \
            --skip-check CKV_GCP_82,CKV_GCP_34

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@e6baf59ee5b1f91d0b65f827518c8c40c5df80f6 # v3.1.2
        with:
          terraform_version: "1.9.8"
      - name: terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false
      - name: terraform plan
        run: |
          terraform -chdir=terraform plan -no-color 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        env:
          TF_VAR_gcp_project: uutisseuranta-activitystreams
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [unit-test, terraform-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.10
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@817b83d791af8a1f089ef2143eb5d630d403aa0d # v2.1.4

      - name: Tallenna nykyiset revisiot rollbackia varten
        run: |
          for svc in query-api write-api; do
            REV=$(gcloud run services describe $svc \
              --region europe-north1 \
              --project uutisseuranta-activitystreams \
              --format='value(status.traffic[0].revisionName)' 2>/dev/null || echo "")
            echo "PREV_${svc//-/_}=$REV" >> $GITHUB_ENV
            echo "Edellinen revisio ($svc): $REV"
          done

      - name: Deploy query-api
        id: deploy_query_api
        run: |
          gcloud run deploy query-api \
            --source src/query_api \
            --region europe-north1 \
            --project uutisseuranta-activitystreams

      - name: Deploy write-api
        id: deploy_write_api
        run: |
          gcloud run deploy write-api \
            --source src/write_api \
            --region europe-north1 \
            --project uutisseuranta-activitystreams

      - name: Deploy og-scraper
        run: |
          gcloud run deploy og-scraper \
            --source src/og_scraper \
            --region europe-north1 \
            --project uutisseuranta-activitystreams

      - name: Post-deploy healthcheck ja automaattinen rollback
        run: |
          FAILED=""
          for svc in query-api write-api; do
            URL=$(gcloud run services describe $svc \
              --region europe-north1 \
              --project uutisseuranta-activitystreams \
              --format='value(status.url)')
            echo "Healthcheck: $svc → $URL/healthz"
            if ! curl -sf --retry 3 --retry-delay 5 "$URL/healthz"; then
              echo "VIRHE: $svc /healthz epäonnistui deployn jälkeen."
              VAR="PREV_${svc//-/_}"
              PREV_REV="${!VAR}"
              if [ -n "$PREV_REV" ]; then
                echo "Palautetaan liikenne revisioon $PREV_REV"
                gcloud run services update-traffic $svc \
                  --to-revisions="$PREV_REV=100" \
                  --region europe-north1 \
                  --project uutisseuranta-activitystreams
              else
                echo "Edellinen revisio tuntematon — rollback ei mahdollinen"
              fi
              FAILED="$FAILED $svc"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "Healthcheck epäonnistui palveluille:$FAILED"
            exit 1
          fi
          echo "Kaikki healthcheckit läpäisty ✓"
